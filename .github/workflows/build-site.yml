name: build-site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Export static data
        run: |
          if [ -d research/input/gptpro ]; then
            python -m overkill.cli export-demo-data
          else
            echo "Research bundles are not in the repository; using the committed static/data/index/bundles.json."
          fi
          python -c "import json; data = json.load(open('static/data/index/bundles.json')); assert data['bundles'], 'no bundles'; print(data['bundle_count'], 'bundles')"

      - name: Verify Pages root redirect
        run: test -f static/index.html
